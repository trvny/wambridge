name: Mobile release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-release.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Build versioned APK
        id: apk
        working-directory: mobile
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version"
          gradle :app:lintDebug :app:assembleDebug
          mkdir -p dist
          apk="dist/wambridge-${version}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=mobile/$apk" >> "$GITHUB_OUTPUT"

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK" --clobber
          else
            gh release create "$tag" "$APK" \
              --target "$GITHUB_SHA" \
              --title "WAMbridge ${VERSION}" \
              --prerelease \
              --notes "Android mobile adapter preview. APK is CI debug-signed while the mobile transport remains experimental."
          fi
