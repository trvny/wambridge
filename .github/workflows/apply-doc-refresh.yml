              r"starts it through Samsung's local `SetUrlPlayback` API\. Finite local-file\n"
              r"playback through Samsung's DMS and queue protocol is under active research\.\n",
              "The stable CLI path serves a tokenized local stream and starts it through "
              "Samsung's `SetUrlPlayback` API. The foobar output is experimental while its "
              "fixed-anchor clock is validated on a physical M5. Finite share/DLNA playback "
              "is protocol-proven but not integrated.\n",
              readme,
          )
          status = '''## Status

This repository is the source of truth after migration from `trvny/trvny`.

- Discovery, saved devices, controls, custom radio stations and native TuneIn presets are
  implemented.
- GitHub Actions builds bundled helpers and the foobar2000 2.x x64 component.
- `Playback -> WAM Bridge` provides emergency stop, standby and raw physical-volume actions.
- The physical M5 produces audible output from foobar's `f32le -> FLAC` path.
- PR #21 fixes host latency/capacity accounting and remains unmerged until a complete
  3-5 minute track, stable seekbar, transitions and cleanup pass on hardware.
- Manual pacing PR #4 and the large share experiment PR #7 are closed. Their measured
  conclusions are retained in the documentation.

Current architecture and continuation notes are in
[`docs/DEVELOPMENT_STATUS.md`](docs/DEVELOPMENT_STATUS.md). Measured protocol facts are in
[`docs/WAM_PROTOCOL.md`](docs/WAM_PROTOCOL.md).

'''
          readme = re.sub(
              r"## Status\n.*?(?=## Foobar2000 output\n)",
