name: Apply READY-before-volume fix

on:
  push:
    branches:
      - fix/pace-foobar-pcm
    paths:
      - tools/apply_ready_before_volume.py
      - .github/workflows/apply-ready-before-volume.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pace-foobar-pcm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/apply_ready_before_volume.py
      - run: |
          rm tools/apply_ready_before_volume.py
          rm .github/workflows/apply-ready-before-volume.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wambridge/pcm_cli.py tests/test_pcm_cli.py foobar/foo_out_wam.cpp tests/test_foobar_source.py tools/apply_ready_before_volume.py .github/workflows/apply-ready-before-volume.yml
          git commit -m "Release PCM before restoring speaker volume"
          git push
