name: Apply MP3 stream diagnostic

on:
  push:
    branches:
      - fix/pace-foobar-pcm
    paths:
      - tools/apply_mp3_stream_debug.py
      - .github/workflows/apply-mp3-stream-debug.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pace-foobar-pcm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/apply_mp3_stream_debug.py
      - run: |
          rm tools/apply_mp3_stream_debug.py
          rm .github/workflows/apply-mp3-stream-debug.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add foobar/foo_out_wam.cpp tests/test_foobar_source.py tools/apply_mp3_stream_debug.py .github/workflows/apply-mp3-stream-debug.yml
          git commit -m "Use MP3 for live WAM output"
          git push

# one-shot
