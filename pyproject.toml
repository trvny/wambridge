[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trvny-wambridge"
version = "0.1.0"
description = "Local Wi-Fi audio bridge for Samsung Wireless Audio Multiroom speakers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "ISC" }
authors = [{ name = "trvny" }]
dependencies = []

[project.scripts]
wambridge = "wambridge.radio_cli:main"
wambridge-control = "wambridge.control_cli:main"
wambridge-events = "wambridge.event_cli:main"
wambridge-pcm = "wambridge.pcm_cli:main"
wambridge-share = "wambridge.share_cli:main"

[dependency-groups]
dev = ["pyinstaller", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
