name: Finish sleep timer regression

on:
  push:
    branches: [feat/foobar-sleep-timer]
    paths: [.github/workflows/finish-sleep-timer-regression.yml]

permissions:
  contents: write

jobs:
  test:
    if: github.repository == 'trvny/wambridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/foobar-sleep-timer
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
      - name: Add replacement-helper regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_pcm_cli.py")
          text = path.read_text(encoding="utf-8")
          marker = "        clear_sleep_timer: bool = False,\n        rejection: str | None = None,\n"
          if marker not in text:
              raise SystemExit("connected watcher signature target not found")
          text = text.replace(
              marker,
              "        menu_sleep_timer_active: bool = False,\n" + marker,
              1,
          )
          marker = "            sleep_after_stop=sleep_after_stop,\n            clear_sleep_timer=clear_sleep_timer,\n"
          if marker not in text:
              raise SystemExit("connected watcher construction target not found")
          text = text.replace(
              marker,
              "            sleep_after_stop=sleep_after_stop,\n"
              "            menu_sleep_timer_active=menu_sleep_timer_active,\n"
              "            clear_sleep_timer=clear_sleep_timer,\n",
              1,
          )
          marker = "    def test_release_arms_the_sleep_timer_only_when_asked(self) -> None:\n"
          if marker not in text:
              raise SystemExit("sleep regression insertion point not found")
          lines = [
              "    def test_replacement_menu_timer_cancel_restores_after_stop_timer(self) -> None:",
              "        watcher, connection = self._connected_watcher(",
              "            sleep_after_stop=120,",
              "            menu_sleep_timer_active=True,",
              "        )",
              "        watcher.arm()",
              "",
              "        watcher.set_sleep_timer(0)",
              "        watcher.release()",
              "",
              '        sleep_commands = [item for item in connection.sent if item[0] == "SetSleepTimer"]',
              "        self.assertEqual(",
              '            [item[1][-1] for item in sleep_commands],',
              "            [",
              '                ("sleeptime", 0, "dec"),',
              '                ("sleeptime", 120, "dec"),',
              "            ],",
              "        )",
              '        self.assertEqual(watcher.release_summary, "stop=sent sleep=120s")',
              "",
              "",
          ]
          text = text.replace(marker, "\n".join(lines) + marker, 1)
          path.write_text(text, encoding="utf-8")
      - name: Validate regression
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff check --select E,F,B,UP src tests foobar/wambridge_pcm_entry.py tools
          uv run python -m unittest discover -s tests -v
      - name: Commit regression and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git rm .github/workflows/finish-sleep-timer-regression.yml
          git add tests/test_pcm_cli.py
          git commit -m 'test(foobar): cover replacement timer cancellation'
          git push origin HEAD:feat/foobar-sleep-timer
