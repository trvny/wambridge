name: Finish sleep timer merge

on:
  push:
    branches: [feat/foobar-sleep-timer]
    paths: [.github/workflows/finish-sleep-timer-merge.yml]

permissions:
  contents: write

jobs:
  merge:
    if: github.repository == 'trvny/wambridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/foobar-sleep-timer
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
      - name: Merge current main conservatively
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff -X theirs origin/main
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Reconcile overlapping sleep control helper
        shell: python
        run: |
          from pathlib import Path

          cpp = Path("foobar/foo_out_wam.cpp")
          text = cpp.read_text(encoding="utf-8")
          symbol = "std::optional<bool> send_sleep_timer_over_helper(int seconds)"
          if symbol not in text:
              marker = "bool send_release_over_helper() {"
              if marker not in text:
                  raise SystemExit("release helper insertion point is missing")
              block = '''std::optional<bool> send_sleep_timer_over_helper(int seconds) {
              return send_control_with_reply_over_helper(
                  "sleep " + std::to_string(seconds) + "\\n"
              );
          }

          '''
              text = text.replace(marker, block + marker, 1)
              cpp.write_text(text, encoding="utf-8")

          header = Path("foobar/wam_control.h")
          text = header.read_text(encoding="utf-8")
          declaration = "std::optional<bool> send_sleep_timer_over_helper(int seconds);"
          if declaration not in text:
              marker = "bool send_pause_over_helper(bool paused);\n"
              if marker not in text:
                  raise SystemExit("pause helper declaration insertion point is missing")
              block = '''
          // Arm or cancel the M5 sleep timer over the active helper. nullopt means there
          // is no helper, true means the helper accepted the request, false means its
          // local control channel rejected or lost the request.
          std::optional<bool> send_sleep_timer_over_helper(int seconds);
          '''
              text = text.replace(marker, marker + block, 1)
              header.write_text(text, encoding="utf-8")

          pcm = Path("src/wambridge/pcm_cli.py")
          text = pcm.read_text(encoding="utf-8")
          menu_guard = (
              "        if self._menu_sleep_timer_active:\n"
              "            self.release_summary += \" sleep=menu\"\n"
              "            return\n"
          )
          if menu_guard not in text:
              marker = "        if self._sleep_after_stop <= 0:\n"
              if marker not in text:
                  raise SystemExit("automatic sleep branch insertion point is missing")
              text = text.replace(marker, menu_guard + marker, 1)
              pcm.write_text(text, encoding="utf-8")
      - name: Assert both control paths survived
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          check() {
            local pattern="$1" file="$2"
            if grep -q "$pattern" "$file"; then
              echo "ok: $pattern in $file"
            else
              echo "MISSING: $pattern in $file"
              missing=1
            fi
          }
          check 'send_release_over_helper' foobar/foo_out_wam.cpp
          check 'send_discard_over_helper' foobar/foo_out_wam.cpp
          check 'send_control_with_reply_over_helper' foobar/foo_out_wam.cpp
          check 'send_sleep_timer_over_helper' foobar/foo_out_wam.cpp
          check 'send_sleep_timer_over_helper' foobar/wam_control.h
          check 'menu_sleep_timer_active' foobar/foo_out_wam.cpp
          check '_menu_sleep_timer_active' src/wambridge/pcm_cli.py
          check 'sleep=menu' src/wambridge/pcm_cli.py
          check 'set_release' src/wambridge/control_channel.py
          check 'set_discard' src/wambridge/control_channel.py
          check 'set_sleep_timer' src/wambridge/control_channel.py
          check 'def discard' src/wambridge/pcm_cli.py
          check 'Start sleep timer' docs/FOOBAR_PLUGIN.md
          exit "$missing"
      - name: Test merged Python paths
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff check --select E,F,B,UP src tests foobar/wambridge_pcm_entry.py tools
          uv run python -m unittest discover -s tests -v
      - name: Commit merge and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finish-sleep-timer-merge.yml
          git add -A
          git commit -m 'Merge main into foobar sleep timer'
          git push origin HEAD:feat/foobar-sleep-timer
