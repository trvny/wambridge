name: Apply menu submenu patch

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 23 &&
      github.event.comment.body == '/apply-menu-submenu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/foobar-menu-submenu
          fetch-depth: 0
      - name: Apply prepared patch
        shell: bash
        run: |
          test "$(git branch --show-current)" = "ui/foobar-menu-submenu"
          base64 --decode patches/menu-submenu.patch.b64 > /tmp/menu-submenu.patch
          sed -i 's/\r$//' /tmp/menu-submenu.patch
          git apply --check /tmp/menu-submenu.patch
          git apply /tmp/menu-submenu.patch
          rm patches/menu-submenu.patch.b64
          rmdir patches 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Group WAM controls in Playback submenu"
          git push origin HEAD:ui/foobar-menu-submenu
