name: Apply startup diagnostics

on:
  push:
    branches:
      - fix/pace-foobar-pcm
    paths:
      - .github/workflows/apply-startup-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pace-foobar-pcm
      - name: Apply diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_startup_diagnostics.py
          git rm tools/apply_startup_diagnostics.py
          git rm .github/workflows/apply-startup-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foobar/foo_out_wam.cpp tests/test_foobar_source.py
          git commit -m "Expose helper startup diagnostics"
          git push origin HEAD:fix/pace-foobar-pcm
