name: Apply output clock patch

on:
  pull_request_target:
    types:
      - synchronize
      - ready_for_review

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 21 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/foobar-output-clock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foobar-output-clock
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          cat patches/output-clock.patch.b64.* | base64 --decode > /tmp/output-clock.patch
          git apply --check /tmp/output-clock.patch
          git apply /tmp/output-clock.patch
          rm patches/output-clock.patch.b64.*
          rmdir patches 2>/dev/null || true
          rm .github/workflows/apply-output-clock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize foobar output clock"
          git push origin HEAD:fix/foobar-output-clock
