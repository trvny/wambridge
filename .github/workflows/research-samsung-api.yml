name: Research Samsung WAM API

on:
  pull_request:
    paths:
      - ".github/workflows/research-samsung-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Samsung Multiroom APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/apk
          docker run --rm \
            -v "$PWD/research/apk:/output" \
            ghcr.io/efforg/apkeep:stable \
            -a com.samsung.roomspeaker3 \
            -d apk-pure \
            /output
          find research/apk -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Verify Samsung signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find research/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          keytool -printcert -jarfile "$apk" | tee research/certificate.txt
          cert_sha256="$(sed -n 's/^[[:space:]]*SHA256: //p' research/certificate.txt | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          expected="43920a268512629943fc2f301d292352f4cd31ca78141965cfe48c1e248d42d5"
          if [[ "$cert_sha256" != "$expected" ]]; then
            echo "Unexpected certificate SHA-256: $cert_sha256" >&2
            exit 1
          fi

      - name: Decompile and extract WAM playback calls
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find research/apk -type f -name '*.apk' -print -quit)"
          curl --fail --location --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip \
            --output research/jadx.zip
          unzip -q research/jadx.zip -d research/jadx-bin
          research/jadx-bin/bin/jadx \
            --threads-count 2 \
            --output-dir research/decompiled \
            "$apk"

          pattern='SetSharePlaybackControl|SetNewFolderPlaybackControl|SetPlaylistPlaybackControl|onSetFolderPlaybackControl|/DLNA/|browseID|browseId'
          grep -R -n -C 40 -E "$pattern" research/decompiled \
            > research/matches.txt || true

          mkdir -p research/matched-sources
          while IFS= read -r file; do
            relative="${file#research/decompiled/}"
            mkdir -p "research/matched-sources/$(dirname "$relative")"
            cp "$file" "research/matched-sources/$relative"
          done < <(grep -R -l -E "$pattern" research/decompiled || true)

          find research/matched-sources -type f -print | sort \
            > research/matched-files.txt
          test -s research/matches.txt
          tar -czf research/matched-sources.tar.gz \
            -C research/matched-sources .

      - uses: actions/upload-artifact@v7
        with:
          name: samsung-wam-api-research
          path: |
            research/certificate.txt
            research/matches.txt
            research/matched-files.txt
            research/matched-sources.tar.gz
          if-no-files-found: error
