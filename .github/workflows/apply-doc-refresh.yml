name: Apply documentation refresh

on:
  push:
    branches:
      - docs/refresh-current-state

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh current documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = {
              "AGENTS.md": r'''# AGENTS.md

Guidance for assistants working in this repository. Read this file together with
`docs/WAM_PROTOCOL.md` and `docs/DEVELOPMENT_STATUS.md` before changing playback code.
Measured facts override old comments, issue summaries and plausible-looking assumptions.

## Testing

- On Windows use `PYTHONPATH=src py -m unittest discover -s tests -q`.
- CI enforces Ruff; it is not assumed to be installed locally.
- Never mock `Popen().stdout` with a bare `MagicMock`. Use a real `BytesIO`.
- A timed-out background process must actually be terminated. The physical test machine
  has 8 GB of RAM and has already been taken down by runaway FFmpeg processes.

## Playback paths are different

- **Share/DLNA:** `StartPlaybackEvent` is the trustworthy playback confirmation.
  `MusicInfo` and `PlayStatus` can report stale or impossible state.
- **URL/PCM:** do not hard-gate on `StartPlaybackEvent`. Repeated audibly playing M5 runs
  reached `WAMBRIDGE AUDIO_STARTED` but emitted no matching start event before the old
  45-second timeout. Keep listening and correlate the event when it appears, but do not
  abort a working URL stream because it is absent.
- `WAMBRIDGE AUDIO_STARTED` means encoded bytes entered the HTTP response. It is the
  earliest measured transport-clock anchor that avoids deadlock, not proof that sound is
  audible.
- `cp` is the normal submode for `SetUrlPlayback`. Do not gate URL playback on submode and
  do not tell anyone to power-cycle the speaker. Whether `cp` affects share playback is a
  separate, unmeasured question.

## Control and stream ownership

- During PCM playback use one persistent TCP `55001` connection for commands and events.
  A separate probe or listener competes with `pcm_cli` and can make playback time out.
- One FFmpeg owns the PCM stdin. The M5 opens another HTTP request while the first is still
  live. Serve the first request and refuse later requests. Retiring the first encoder kills
  the working stream; running two encoders splits the PCM between them.
- Command timeouts are not automatically failures. Match responses and events to the
  command or stream attempt. Unmatched `ErrorEvent` values are diagnostics.
- Never hand remote URLs directly to `SetUrlPlayback`. Proxy through FFmpeg and the local
  HTTP server.

## Output clock

- TCP backpressure paces the speaker-facing HTTP stream. Do not add FFmpeg `-re`, socket
  throttling or a second speaker-facing timer.
- Backpressure does not pace foobar's accounting. The output must count queued PCM,
  pipe writes in progress and submitted-but-not-yet-played frames as latency.
- Start one cumulative real-time clock at `AUDIO_STARTED`. Pause may shift its anchor;
  pipe writes must never re-anchor it to `now`. Cap played frames with the amount actually
  submitted instead.
- A measured `+21..23 s` figure included discovery and startup. It is an upper bound, not a
  speaker cushion and not a target for `get_latency()`.
- Foobar's `f32le -> FLAC -> M5` path is confirmed to produce audible output. A complete
  normal-speed 3-5 minute track is still the acceptance gate.

## Physical M5 validation

- Start at raw volume step `3` or lower.
- Identify artifacts by commit SHA or workflow run. ZIP timestamps are UTC while installed
  file times on the test machine are local UTC+2.
- Use beefweb for foobar position, the process tree for FFmpeg leaks and
  `Get-NetTCPConnection` for abandoned sockets. `ReadTransferCount` and the tested Windows
  process I/O counters do not work on this machine.
- Do not merge transport changes before a complete track, stable seekbar, second track,
  pause/resume, stop/change and clean process shutdown pass on the physical M5.

## Repository workflow

- Check current `main`, open PRs and recent commits before starting.
- Keep one logical change per PR. Truly small low-risk edits may go directly to `main`.
- Codex may review and advise, but do not ask or rely on it to commit or push. A change exists
  only when its SHA is visible in the repository.
- Wait for CI and automatic review. Resolve actionable threads before merging; use squash
  merge unless the change is intentionally direct-to-main.
- `docs/WAM_PROTOCOL.md` stores measured protocol facts. `docs/DEVELOPMENT_STATUS.md`
  stores implementation and PR status. Correct both when a measurement invalidates an
  assumption.
''',
              "docs/WAM_PROTOCOL.md": r'''# Samsung WAM protocol notes

Measured facts for a physical Samsung Shape M5. Keep path-specific observations separate:
what is true for share/DLNA is not automatically true for `SetUrlPlayback` PCM streams.

## Test device

- model: `SPK-WAM550`
- firmware: `WAM550WWB-3117.1`
- protocol version: `2.3`
- LAN control API: TCP `55001`
- raw volume range: `0..30`

Primary evidence is preserved in PR #7, PR #21 and `tools/wam-probes/`.

## Current path summary

| Path | What confirms or anchors it | Current state |
| --- | --- | --- |
| URL/PCM through `SetUrlPlayback` | `AUDIO_STARTED` anchors bounded host flow; correlated events remain diagnostics | Audible short runs work; full-track timing validation is pending |
| Share/DLNA through `SetSharePlaybackControl` | `StartPlaybackEvent` | Audible finite-file playback is proven; integration is not active |
| Generic UPnP AVTransport | none exists on this M5 | Rejected |

`MusicInfo` and `PlayStatus` are not reliable success signals. They have reported `play`
with no audio and mixed fields from older sessions.

## TCP 55001 and client identity

Official clients send a stable identity:

```text
mobileUUID: <stable client UUID>
mobileName: Wireless Audio
mobileVersion: 1.0
```

Responses contain `user_identifier`. Captures show three useful buckets: the client UUID,
a foreign UUID and the literal `public` for unattributed broadcasts.

For active PCM playback, one persistent connection must both send commands and read events.
Opening a second listener or probe while `pcm_cli` owns the control channel can make the M5
stop answering the player. The standalone `wambridge-events` tool is diagnostic and should
not be run beside an active PCM session.

A command timeout is not proof of failure. The firmware may answer late or emit an unrelated
event. Match what can be matched; keep unmatched events as diagnostics. A concrete
`NETWORK_TIMEOUT_ERROR` after the speaker requested the active HTTP stream is meaningful
because it indicates starvation of that stream.

## URL/PCM playback

The universal path is:

```text
foobar PCM -> helper stdin -> FFmpeg -> local HTTP -> SetUrlPlayback -> M5
```

The speaker pulls from the local HTTP server. Do not send a remote URL directly:

- HTTPS has failed,
- Ogg has been fetched silently,
- HLS has wedged the control port.

Proxy all sources through the local server.

### Submode

`SetUrlPlayback` normally switches the tested M5 from `dlna` to `cp`. A measured run stayed
in `cp` for about 100 seconds while throughput held around 1.00x and audio was confirmed by
ear. `cp` is not a URL-path fault and must not trigger a power-cycle instruction.

### One encoder per PCM input

Every FFmpeg launched for a stream request inherits the same stdin. The M5 may open a second
HTTP request while the first is still live.

- Running both encoders splits one PCM stream and produces holes, jumps and leaked processes.
- Retiring the first encoder kills the stream actually being consumed.
- The correct behavior is to keep the first active encoder and refuse later requests.

This removed the repeated `NETWORK_TIMEOUT_ERROR` pattern caused by starving the speaker.

### Protocol markers

The helper exposes this progression to the component:

```text
WAMBRIDGE STREAM_REQUESTED
WAMBRIDGE ENCODER_STARTED
WAMBRIDGE READY
WAMBRIDGE AUDIO_STARTED
WAMBRIDGE PLAYING volume=<raw-step>
```

`AUDIO_STARTED` means FFmpeg produced bytes and the HTTP response started carrying encoded
audio. It does not prove that the speaker is audible. `PLAYING` on the URL/PCM path means the
helper has a live stream and its bounded host clock may progress; it is not a renamed
`StartPlaybackEvent`.

Repeated physical runs were audibly playing after `AUDIO_STARTED` but did not emit a
matching `StartPlaybackEvent` before the former 45-second timeout. Therefore URL/PCM must
not block or abort on that event. Keep the listener active, log a correlated event when it
appears and still surface real asynchronous failures.

## Speaker transport versus host output clock

These are separate clocks.

### Speaker-facing transport

The M5 closes its TCP receive window as its buffer fills. HTTP throughput converges toward
real time without FFmpeg `-re` or manual socket throttling. A control run showed an initial
burst, then stable throughput near 1.00x after roughly 25 seconds.

The often-quoted `+21..23 s` value was measured from process start and includes discovery,
URL handoff and helper startup. It is only an upper bound, not a measured speaker buffer and
not a latency target.

### Foobar-facing accounting

Writing PCM to the helper pipe does not mean it has been heard. The output adapter must
retain all of these in latency and capacity accounting:

- PCM still in the C++ queue,
- the current pipe write,
- PCM submitted to the helper but not released by the host playback clock.

Two physical failures identified the required algorithm:

1. Waiting for `StartPlaybackEvent` before releasing capacity filled the minimum four-second
   output capacity and froze foobar after exactly four seconds, while the M5 path could
   otherwise play.
2. Starting at `AUDIO_STARTED` but resetting the clock anchor to `now` whenever wall time
   caught submitted PCM made the anchor follow pipe-write speed. Foobar advanced at about
   94x and immediately opened later tracks.

The correction is one cumulative monotonic anchor at `AUDIO_STARTED`, shifted only by pause.
Compute a real-time target from that fixed anchor and set played frames to
`min(target, submitted)`. Never move the anchor because submitted PCM temporarily ran out.

No complete 3-5 minute foobar track has yet passed this corrected algorithm on hardware.
That physical run remains the release gate.

## Share/DLNA finite-file playback

`SetSharePlaybackControl` reaches audible playback when both of these are correct:

1. `device_udn` is the raw registered client UUID, without a `uuid:` prefix.
2. The object is served at `/DLNA/<objectid>`.

Measured values and behavior:

- official DMS port: `49200`,
- object IDs: flat `<hash>.<extension>`,
- successful sequence: `MediaBufferStartEvent` -> `MediaBufferEndEvent` ->
  `StartPlaybackEvent`,
- `MusicPlayTime` exposes position and total length,
- `playertype` and `sourcename` did not change the result,
- a single-file share command works; the official app's multi-queue is not mandatory.

The old assumptions `3921`, MediaServer UDN as `device_udn`, numeric object `1`, root-path
serving and HTTP contact as success are all invalid.

### Formats measured through share playback

| Format | Result | Requests |
| --- | --- | --- |
| MP3 44.1/16 | plays | 1 |
| WAV 44.1/16 PCM | plays | 1 |
| FLAC 44.1/16 | plays | 1 |
| FLAC 96/24 | plays | 1 |
| AAC in MP4 (`.m4a`) | plays | 3 with Range |
| Opus 48k | fails after retries | 5 |

MP4 requires Range support. FLAC does not require transcoding, including the measured
96/24 file.

## Streams and lengths

`SetUrlPlayback` accepts endless streams with no known duration:

| HTTP response | Result |
| --- | --- |
| chunked | clean, one connection |
| no `Content-Length`, connection close | clean, one connection |
| radio-style MP3 | clean, one connection |
| oversized fake `Content-Length` | worst case: retries and aborted connections |

Never fake a length. Use chunked or close-delimited output.

## Volume

The tested firmware uses raw steps `0..30`. Values above 30 are silently clamped to maximum
while still returning success. Until model-aware conversion exists:

- `3` is approximately 10 percent,
- `6` is approximately 20 percent,
- `30` is maximum.

Start hardware tests at step `3` or lower.

## No AVTransport renderer

The tested M5 exposes no standard UPnP MediaRenderer or AVTransport service. Ports `7676`,
`8080` and `55001` were open; `9197` was closed. Do not restart generic `foo_out_upnp` work
without evidence from different firmware.

## Still unknown

- Exact official multi-queue request bodies and timing.
- Whether `cp` blocks the share/DLNA path.
- A reliable URL/PCM speaker event that always corresponds to audible start.
- Full-track drift, pause/resume and transition behavior of the fixed-anchor foobar build.

## Safety and acceptance

- Keep control and HTTP/DMS ports inside the trusted LAN.
- Do not treat an `ok` response as audible playback.
- Do not run competing control probes during PCM playback.
- A transport candidate is accepted only after a complete 3-5 minute track at wall-clock
  speed, stable seekbar, second track, pause/resume, stop/change and clean helper/FFmpeg
  shutdown on the physical M5.
''',
              "docs/DEVELOPMENT_STATUS.md": r'''# Development status

Last reviewed: 2026-08-01.

Continuity note for playback work. Read this with `WAM_PROTOCOL.md` before reviving an old
branch or implementing another timing layer.

## Stable on `main`

- SSDP discovery with subnet fallback and saved devices resolved by stable device ID.
- Status, raw volume, mute, pause, play, stop and standby control.
- Direct `SetUrlPlayback`, custom radio stations and native TuneIn preset playback.
- Windows builds for bundled helpers and foobar2000 2.x x64.
- Restricted helper handle inheritance from merged PR #2.
- Persistent event listener from merged PR #9.
- `Playback -> WAM Bridge` submenu with emergency stop, standby and physical volume actions
  from merged PR #23.
- PCM HTTP server keeps the first FFmpeg and refuses duplicate stream requests, so one
  encoder owns stdin.
- `cp` is documented as normal for the URL path; no URL startup gate or power-cycle advice
  may depend on that submode.

The stable universal transport is local HTTP started through `SetUrlPlayback`. The speaker
paces the HTTP side through TCP backpressure. Finite share/DLNA playback is proven as a
separate optional path but is not integrated into the foobar output.

## Active pull request

### PR #21: synchronize the foobar output clock

Branch: `fix/foobar-output-clock`

Latest documented candidate: `0db3742`, green in Build #227.

The branch:

- counts queued, in-progress and submitted PCM in latency and capacity,
- starts one cumulative host clock at `WAMBRIDGE AUDIO_STARTED`,
- shifts that anchor only for pause and never re-anchors it to pipe-write completion,
- caps played frames by submitted frames,
- keeps `force_play()` as a transient drain request,
- keeps one TCP `55001` connection for commands and events,
- leaves `StartPlaybackEvent` diagnostic on URL/PCM instead of a 45-second hard gate,
- mirrors helper logs and errors into the foobar console,
- keeps FFmpeg free of `-re` and refuses duplicate stream encoders.

Physical measurements behind the design:

- gating capacity on `StartPlaybackEvent` filled the minimum four-second buffer and froze
  foobar after four seconds,
- releasing capacity from a clock repeatedly reset to `now` let foobar advance at about 94x,
- short `f32le -> FLAC -> M5` runs produced audible sound,
- the audibly playing URL path did not emit a matching start event before the old timeout,
- `NETWORK_TIMEOUT_ERROR` disappeared after stream starvation was fixed.

Do not merge yet. The current build still needs one complete 3-5 minute track against wall
clock, stable seekbar, second track, pause/resume, stop/change and process cleanup on the
physical M5.

## Closed investigations retained as evidence

### PR #4: manual PCM pacing

Closed without merge. It correctly proved that the M5 paces the speaker-facing HTTP stream
through TCP backpressure, but the original conclusion was too broad. Backpressure does not
pace foobar's own output accounting. Do not restore FFmpeg `-re` or HTTP throttling; fix
host latency and capacity instead.

### PR #7: finite share/DLNA playback

Closed without merge after the experiment became too large and its early assumptions were
invalidated. The useful result remains proven:

- `SetSharePlaybackControl` works,
- `device_udn` is the raw registered client UUID,
- media is served at `/DLNA/<objectid>` on port `49200`,
- `StartPlaybackEvent` confirms this path,
- finite playback can expose duration, pause and seek state.

A future implementation should be rebuilt as a small optional layer with one known-good
attempt, not resurrect the old fallback ladder.

## Current conclusions

### Universal URL/PCM transport

Status: foundation, with foobar clock work still experimental.

- Works for files, radio and endless sources.
- Uses local HTTP without fake `Content-Length`.
- Uses one control connection and one encoder.
- Relies on speaker TCP backpressure for HTTP pacing.
- Requires separate bounded host accounting for accepted-but-not-heard PCM.

### Finite share/DLNA transport

Status: protocol proven, product integration deferred.

Use it later for local files that benefit from native duration, pause and seek. It cannot be
the universal foundation because it does not cover endless sources.

### Generic UPnP AVTransport

Status: rejected for the tested `SPK-WAM550`. The service is not exposed.

## Next order

1. Finish the physical acceptance run for PR #21.
2. Fix raw M5 volume handling to `0..30` or add model-aware percentage conversion.
3. Reduce and reimplement the finite share path from its measured working form.
4. Add a proper foobar preferences page while retaining legacy INI compatibility.
5. Add TuneIn/radio UI and a dockable panel only after output transport is stable.

## Rules for continuing

- Check `main`, open PRs and recent commits first.
- One logical stage per PR; no unrelated refactors or long changelogs.
- Do not merge transport work without the physical M5 checklist.
- Do not reopen AVTransport without new device evidence.
- Do not reintroduce `-re`, socket throttling, fake `Content-Length`, competing 55001
  listeners or multiple FFmpeg readers for one PCM stdin.
- Keep raw test volume at step `3` or lower.
''',
              "docs/FOOBAR_PLUGIN.md": r'''# foobar2000 component status and design

Current implementation and remaining control-surface work for `foo_out_wam`.

## Implemented

- `output_v6` component for foobar2000 2.x x64.
- Bundled `wambridge-pcm.exe` and `wambridge-control.exe`; no checkout or virtual
  environment is required after installation.
- PCM pipeline: foobar `f32le` -> FFmpeg FLAC -> local HTTP -> Samsung M5.
- `%LOCALAPPDATA%\WAMBridge\foobar.ini` configuration with environment overrides.
- `Playback -> WAM Bridge` submenu containing:
  - Emergency stop,
  - Standby,
  - Volume up,
  - Volume down,
  - Volume to safe level.
- Serialized control-helper queue with output reported in the foobar console.
- Restart and cleanup paths for format change, seek, stop and helper failure.

## Not implemented

- Native preferences page.
- Discovery and connection test UI.
- TuneIn/radio submenu.
- Dockable panel.
- Integrated finite share/DLNA playback for native duration and seek.

## Configuration

The component currently reads:

```ini
[wambridge]
device=M5
volume=3
```

Optional keys and overrides:

- `helper` or `WAMBRIDGE_PCM` for a development PCM helper,
- `WAMBRIDGE_CONTROL` for a development control helper,
- `WAMBRIDGE_DEVICE`,
- `WAMBRIDGE_VOLUME`.

The M5 uses raw volume steps `0..30`; the UI must not pretend these are percentages until a
model-aware conversion exists.

## Transport design

The speaker pulls the encoded stream. TCP backpressure is the speaker-facing pacing
mechanism; do not add FFmpeg `-re` or socket throttling.

Foobar still needs its own bounded accounting. PR #21 keeps queued, writing and submitted
PCM in latency and releases capacity from one cumulative real-time clock anchored at
`AUDIO_STARTED`. The anchor may shift for pause only; it must not follow pipe-write speed.

The URL/PCM path does not hard-gate on `StartPlaybackEvent`. Physical M5 runs produced
audible output without a matching event before the old timeout. The listener stays alive to
log correlated starts and surface real failures.

Only one control connection and one FFmpeg may own a session. A second TCP listener can
compete with playback; a second FFmpeg splits the shared stdin.

## Menu behavior

Emergency stop and standby stop foobar before invoking the control helper. Commands are
serialized so button presses cannot launch overlapping control processes. Physical volume
commands operate in raw M5 steps.

Do not restore the old `cp` warning. `cp` is normal for `SetUrlPlayback`; it is not evidence
that emergency stop should request a speaker power cycle.

## Preferences page, next

Add `preferences_page_v3` under Playback and keep INI compatibility for at least one
release. It should expose:

- speaker alias/IP and discovery,
- startup and maximum startup volume (`0..30` raw until conversion exists),
- output format,
- bundled/development helper selection,
- a test button showing model, firmware and connection result.

## Later UI

Radio/TuneIn controls and a dockable panel should reuse the same dispatcher and settings.
Native TuneIn can continue without the PC; proxied stations require the PC and local HTTP
bridge. Label that difference clearly.

## Merge gate

No output transport candidate is release-ready until the physical M5 completes a 3-5 minute
track at wall-clock speed with stable seekbar, a second track, pause/resume, stop/change and
clean helper/FFmpeg shutdown.
''',
              "docs/EVENT_LISTENER.md": r'''# WAM event listener

`wambridge-events` is a standalone diagnostic tool for TCP `55001`. It keeps a reader open
and sends a harmless `GetFunc` request so the firmware begins returning responses and
unsolicited events.

## Important topology rule

Do not run this tool, `wamtap sniff` or another 55001 probe beside active `pcm_cli` playback.
The tested M5 effectively allows one useful control session during that path; a second
listener can compete with the player and produce timeouts.

Integrated PCM playback uses one `WamEventConnection` for both commands and events. The
standalone listener's separate writer is acceptable only as an isolated diagnostic, not as
the playback architecture.

## Usage

```powershell
wambridge-events --device M5
wambridge-events --device M5 --raw
wambridge-events --device M5 --duration 120
wambridge-events --device M5 --client-uuid <stable-uuid>
```

Without `--client-uuid`, the tool prints a temporary UUID at startup.

## Event interpretation

- `DMSAddedEvent`: DMS registration accepted.
- `MediaBufferStartEvent` / `MediaBufferEndEvent`: share-path buffering.
- `StartPlaybackEvent`: trustworthy confirmation for share/DLNA playback.
- `MusicPlayTime`: position and total length when firmware provides it.
- `MusicInfo` and `PlayStatus`: diagnostics only; they can be stale or false.
- `ErrorEvent`: preserve `errcode` and `errCode`; correlate before treating it as the active
  command's failure.

For URL/PCM, a matching `StartPlaybackEvent` is useful when it appears but is not a hard
startup gate. Audibly playing runs have completed the helper startup without that event
before the former timeout.

The listener sees responses and events. It does not capture the exact outgoing request made
by another client.
''',
              "foobar/README.md": r'''![foobar2000](https://img.shields.io/badge/foobar2000-000?logo=foobar2000&logoColor=fff&style=for-the-badge) ![C++](https://img.shields.io/badge/C%2B%2B-00599C?logo=cplusplus&logoColor=fff&style=for-the-badge)
# Foobar2000 output

`foo_out_wam` exposes `Samsung M5 (Wi-Fi)` as a foobar2000 2.x x64 output. It sends
foobar's decoded `f32le` PCM to the bundled helper, encodes FLAC and offers the stream to
the M5 through local HTTP and `SetUrlPlayback`.

The component produces audible output on the physical M5 but remains experimental. The
fixed-anchor PR #21 candidate still requires a complete normal-speed track and transition
check before merge.

## Requirements

- foobar2000 2.x x64
- a saved WAM device profile, normally `M5`
- speaker and PC in the same LAN

FFmpeg is bundled inside the component helper artifact; a source checkout and Python virtual
environment are not required after installation.

## Install a development build

Download `foo_out_wam-x64` from a successful Build workflow, extract it and open
`foo_out_wam.fb2k-component` with foobar2000. Then select:

```text
Preferences -> Playback -> Output -> Samsung M5 (Wi-Fi)
```

Prefer an artifact whose name or accompanying workflow identifies the tested commit SHA.
ZIP member timestamps are UTC; installed Windows timestamps on the test machine are UTC+2.

## Configure

Create `%LOCALAPPDATA%\WAMBridge\foobar.ini`:

```ini
[wambridge]
device=M5
volume=3
```

The M5 uses raw volume steps `0..30`; `3` is roughly 10 percent. Values above 30 are
silently clamped to maximum. Model-aware percentage conversion is not implemented.

Environment overrides:

```text
WAMBRIDGE_PCM
WAMBRIDGE_CONTROL
WAMBRIDGE_DEVICE
WAMBRIDGE_VOLUME
```

## WAM controls

The installed component adds:

```text
Playback -> WAM Bridge -> Emergency stop
Playback -> WAM Bridge -> Standby
Playback -> WAM Bridge -> Volume up
Playback -> WAM Bridge -> Volume down
Playback -> WAM Bridge -> Volume to safe level
```

Commands run through a serialized bundled control helper and report completion or errors in
the foobar console.

## Current output behavior

- One helper session owns one PCM stream.
- The first speaker HTTP request owns FFmpeg; duplicate requests are refused.
- PCM queued locally, in the pipe write and submitted to the helper is included in output
  capacity and latency on PR #21.
- Pause keeps the stream alive with paced silence and shifts the host clock anchor.
- Seek, stop and format change restart the helper so stale PCM cannot enter the next stream.
- Helper logs and protocol errors are mirrored to the foobar console.
- A helper crash invalidates the output instead of silently respawning forever.

## Timing findings

The speaker-facing HTTP stream needs no FFmpeg `-re`: TCP backpressure converges toward
real time.

Foobar's position is separate. Two measured failures were:

- a hard `StartPlaybackEvent` gate filled the four-second capacity and froze the seekbar,
- resetting the real-time anchor to each pipe-write catch-up let foobar advance at about
  94x and open later tracks immediately.

The current candidate starts one cumulative clock at `WAMBRIDGE AUDIO_STARTED`, shifts it
only for pause and caps played frames by submitted frames. URL/PCM does not abort because a
matching `StartPlaybackEvent` is absent; the event listener remains active for diagnostics.

`AUDIO_STARTED` is a transport anchor, not proof of audible sound. Hardware acceptance is
still required.

## Expected helper markers

```text
WAMBRIDGE STREAM_REQUESTED
WAMBRIDGE ENCODER_STARTED
WAMBRIDGE READY
WAMBRIDGE AUDIO_STARTED
WAMBRIDGE PLAYING volume=3
```

## Physical M5 checklist

Before merging an output candidate:

1. Start at raw volume step `3` or lower.
2. Play one complete 3-5 minute track at wall-clock speed.
3. Keep the seekbar aligned with audible playback.
4. Play a second same-format track without instant skip or stale audio.
5. Test early and normal pause/resume.
6. Test stop, seek and track change.
7. Confirm no extra FFmpeg/helper processes or abandoned speaker sockets remain.
8. Confirm errors are visible in the foobar console.

## Manual helper test

```powershell
cmd /d /c "ffmpeg -hide_banner -loglevel error -i C:\Music\test.opus -f f32le -acodec pcm_f32le -ar 48000 -ac 2 - | wambridge-pcm --device M5 --sample-rate 48000 --channels 2 --sample-format f32le --format flac --volume 3"
```

Do not run a separate `wambridge-events` or `wamtap` listener during this test.
''',
              "tools/wam-probes/README.md": r'''# WAM probes

One-shot diagnostic scripts that produced the measured facts in
`docs/WAM_PROTOCOL.md`. They are kept because physical M5 measurements are expensive and
several probes disproved assumptions that had already reached code or documentation.

These are not supported user tools. Comments may be in Polish and the test suite does not
cover them.

## Configuration

| Variable | Meaning | Default |
| --- | --- | --- |
| `WAM_SPEAKER` | speaker address | `192.168.1.50` |
| `WAM_HOST` | this machine as seen by the speaker | `192.168.1.10` |
| `WAM_MEDIA` | audio file | `sample.mp3` |
| `WAM_SCRATCH` | generated files | `_scratch/` |

## What the probes settled

| Script | Result |
| --- | --- |
| `probe_share.py` | Share playback requires raw client UUID and `/DLNA/<objectid>` |
| `probe_playertype.py` | `playertype`/`sourcename` do not decide success |
