name: Finish sleep timer routing

on:
  push:
    branches: [feat/foobar-sleep-timer]
    paths: [.github/workflows/finish-sleep-timer-routing.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'trvny/wambridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/foobar-sleep-timer
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
      - name: Restore explicit sleep callback after release-discard merge
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/wambridge/control_channel.py")
          text = path.read_text(encoding="utf-8")
          old = "        set_release: Callable[[], None] | None = None,\n        set_discard: Callable[[], None] | None = None,\n        minimum_volume: int = 0,"
          new = "        set_release: Callable[[], None] | None = None,\n        set_discard: Callable[[], None] | None = None,\n        set_sleep_timer: Callable[[int], None] | None = None,\n        minimum_volume: int = 0,"
          if old not in text:
              raise SystemExit("ControlChannel signature target not found")
          text = text.replace(old, new, 1)
          old = "        self._set_release = set_release\n        self._set_discard = set_discard\n        self._minimum_volume = minimum_volume"
          new = "        self._set_release = set_release\n        self._set_discard = set_discard\n        self._set_sleep_timer = set_sleep_timer\n        self._minimum_volume = minimum_volume"
          if old not in text:
              raise SystemExit("ControlChannel assignment target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src/wambridge/pcm_cli.py")
          text = path.read_text(encoding="utf-8")
          old = "                set_release=watcher.release,\n                set_discard=watcher.discard,\n                minimum_volume=RAW_MIN_VOLUME,"
          new = "                set_release=watcher.release,\n                set_discard=watcher.discard,\n                set_sleep_timer=watcher.set_sleep_timer,\n                minimum_volume=RAW_MIN_VOLUME,"
          if old not in text:
              raise SystemExit("PCM ControlChannel target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("docs/DEVELOPMENT_STATUS.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("7. **Offer the sleep timer as a menu command")
          end = text.index("8. ~~**Move release onto the helper's control channel.**~~", start)
          replacement = "7. ~~**Offer the sleep timer as a menu command, not only as an automatic fallback.**~~ **Done and hardware-validated 2026-08-29.**\n   `Playback -> WAM Bridge` now exposes `Start sleep timer` and `Cancel sleep timer`, reusing\n   the configured `sleep_after_stop` duration. During PCM playback the command travels over\n   the helper's existing control connection. The absolute deadline survives helper replacement\n   and foobar restart, and release/discard preserves a menu-armed timer. Foobar stops two seconds\n   before the M5 deadline so standby does not look like a failed helper exit and respawn it. A\n   30 s physical M5 pass confirmed the timer fired with no helper respawn. Persistence is\n   best-effort: if the INI write fails, the live coordinator still follows the timer accepted\n   by the speaker.\n\n"
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
      - name: Validate merged routing
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff check --select E,F,B,UP src tests foobar/wambridge_pcm_entry.py tools
          uv run python -m unittest discover -s tests -v
      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git rm .github/workflows/finish-sleep-timer-routing.yml
          git add src/wambridge/control_channel.py src/wambridge/pcm_cli.py docs/DEVELOPMENT_STATUS.md
          git commit -m 'fix(foobar): restore sleep timer control routing'
          git push origin HEAD:feat/foobar-sleep-timer
