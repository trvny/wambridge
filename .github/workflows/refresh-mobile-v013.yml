name: Refresh mobile v0.1.3 asset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-mobile-v013.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      WAMBRIDGE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      WAMBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      WAMBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      WAMBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare signing
        shell: bash
        run: |
          set -euo pipefail
          for value in "$WAMBRIDGE_KEYSTORE_BASE64" \
                       "$WAMBRIDGE_KEYSTORE_PASSWORD" \
                       "$WAMBRIDGE_KEY_ALIAS" \
                       "$WAMBRIDGE_KEY_PASSWORD"; do
            test -n "$value"
          done
          printf '%s' "$WAMBRIDGE_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/wambridge-release.keystore"
          echo "WAMBRIDGE_KEYSTORE_PATH=$RUNNER_TEMP/wambridge-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintRelease :app:assembleRelease \
            -PwamVersionName=0.1.3 \
            -PwamVersionCode=103
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/wambridge-0.1.3.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose --print-certs dist/wambridge-0.1.3.apk

      - name: Replace existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view mobile-v0.1.3
          gh release upload mobile-v0.1.3 mobile/dist/wambridge-0.1.3.apk --clobber

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-mobile-v013.yml
          git commit -m "Remove one-shot release refresh"
          git push
