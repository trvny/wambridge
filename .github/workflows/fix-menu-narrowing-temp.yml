name: Fix menu action labels

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 23 &&
      github.event.comment.body == '/fix-menu-narrowing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/foobar-menu-submenu
          fetch-depth: 0
      - name: Fix explicit wide-to-ASCII conversion
        shell: python
        run: |
          from pathlib import Path

          path = Path("foobar/wam_menu.cpp")
          source = path.read_text(encoding="utf-8")
          old = '''std::string action_label(const std::wstring& action) {
              return {action.begin(), action.end()};
          }
          '''
          new = '''std::string action_label(const std::wstring& action) {
              std::string label;
              label.reserve(action.size());
              for (const wchar_t character : action) {
                  label.push_back(
                      character >= 0 && character <= 0x7f
                          ? static_cast<char>(character)
                          : '?'
                  );
              }
              return label;
          }
          '''
          if old not in source:
              raise SystemExit("expected action_label implementation not found")
          path.write_text(source.replace(old, new), encoding="utf-8")
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add foobar/wam_menu.cpp
          git commit -m "Fix menu action label conversion"
          git push origin HEAD:ui/foobar-menu-submenu
