name: Refresh mobile v0.1.3 asset

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/release-refresh-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      WAMBRIDGE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.WAMBRIDGE_ANDROID_KEYSTORE_BASE64 }}
      WAMBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.WAMBRIDGE_ANDROID_KEYSTORE_PASSWORD }}
      WAMBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.WAMBRIDGE_ANDROID_KEY_ALIAS }}
      WAMBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.WAMBRIDGE_ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: dcc8b20deacdcb58aa76f5e99ea1ab558dceaa43

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare signing
        shell: bash
        run: |
          set -euo pipefail
          for value in "$WAMBRIDGE_KEYSTORE_BASE64" \
                       "$WAMBRIDGE_KEYSTORE_PASSWORD" \
                       "$WAMBRIDGE_KEY_ALIAS" \
                       "$WAMBRIDGE_KEY_PASSWORD"; do
            test -n "$value"
          done
          printf '%s' "$WAMBRIDGE_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/wambridge-release.keystore"
          echo "WAMBRIDGE_KEYSTORE_PATH=$RUNNER_TEMP/wambridge-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintRelease :app:assembleRelease \
            -PwamVersionName=0.1.3 \
            -PwamVersionCode=103
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/wambridge-0.1.3.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose --print-certs dist/wambridge-0.1.3.apk

      - name: Replace existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view mobile-v0.1.3
          gh release upload mobile-v0.1.3 mobile/dist/wambridge-0.1.3.apk --clobber
