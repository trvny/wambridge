name: Apply output clock patch

on:
  push:
    branches:
      - fix/foobar-output-clock
    paths:
      - patches/output-clock.patch.b64.*
      - .github/workflows/apply-output-clock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          cat patches/output-clock.patch.b64.* | base64 --decode > /tmp/output-clock.patch
          git apply --check /tmp/output-clock.patch
          git apply /tmp/output-clock.patch
          rm patches/output-clock.patch.b64.*
          rmdir patches 2>/dev/null || true
          rm .github/workflows/apply-output-clock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize foobar output clock"
          git push origin HEAD:fix/foobar-output-clock
