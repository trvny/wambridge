      - name: Validate documentation patch
        shell: bash
        run: |
          git diff --check
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"

      - name: Commit documentation
        shell: bash
        run: |
          rm .github/workflows/apply-doc-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs foobar/README.md tools/wam-probes/README.md .github/workflows/apply-doc-refresh.yml
          git commit -m "Refresh measured WAM documentation"
          git push origin HEAD
