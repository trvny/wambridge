name: Build

on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "foobar/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "foobar/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/uv-python314

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true

      - name: Resolve dependencies
        shell: pwsh
        run: |
          uv lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit lockfile
        shell: pwsh
        run: |
          git add uv.lock
          if (git diff --cached --quiet) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock Wambridge dependencies"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:ci/uv-python314
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Python
        shell: pwsh
        run: |
          uv run ruff check --select E,F,B,UP src tests foobar/wambridge_pcm_entry.py tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -m compileall -q src tests foobar/wambridge_pcm_entry.py tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Python package
        shell: pwsh
        run: |
          uv run python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run wambridge-control --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run wambridge-events --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone helper
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name wambridge-pcm `
            --distpath dist/helper `
            --workpath build/pyinstaller `
            --specpath build/pyinstaller `
            foobar/wambridge_pcm_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/helper/wambridge-pcm/wambridge-pcm.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build standalone control helper
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name wambridge-control `
            --distpath dist/control `
            --workpath build/pyinstaller-control `
            --specpath build/pyinstaller-control `
            tools/wambridge_control_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/control/wambridge-control.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build standalone event listener
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name wambridge-events `
            --distpath dist/events `
            --workpath build/pyinstaller-events `
            --specpath build/pyinstaller-events `
            tools/wambridge_events_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/events/wambridge-events.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Download foobar2000 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external/foobar-sdk | Out-Null
          Invoke-WebRequest `
            -Uri "https://www.foobar2000.org/downloads/SDK-2025-03-07.7z" `
            -OutFile external/foobar-sdk.7z
          7z x external/foobar-sdk.7z -oexternal/foobar-sdk -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdkProject = Get-ChildItem external/foobar-sdk `
            -Recurse -Filter foobar2000_SDK.vcxproj | Select-Object -First 1
          if (-not $sdkProject) {
            throw "foobar2000 SDK project not found after extraction"
          }
          $sdkRoot = Split-Path `
            (Split-Path (Split-Path $sdkProject.FullName -Parent) -Parent) -Parent
          "FOOBAR_SDK_ROOT=$sdkRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64 component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found"
          }
          & $msbuild foobar/foo_out_wam.vcxproj `
            /t:Rebuild `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VCToolsVersion=14.29.30133 `
            "/p:FoobarSdkRoot=$env:FOOBAR_SDK_ROOT"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package component and source
        shell: pwsh
        run: |
          $output = "foobar/build/x64/Release/foo_out_wam.dll"
          if (-not (Test-Path $output)) {
            throw "foo_out_wam.dll was not produced"
          }
          New-Item -ItemType Directory -Force dist/component | Out-Null
          Copy-Item $output dist/component/foo_out_wam.dll
          Copy-Item `
            dist/helper/wambridge-pcm `
            dist/component/wambridge-pcm `
            -Recurse
          New-Item -ItemType Directory -Force dist/component/wambridge-control | Out-Null
          Copy-Item `
            dist/control/wambridge-control.exe `
            dist/component/wambridge-control/wambridge-control.exe
          Push-Location dist/component
          7z a -tzip ../foo_out_wam.fb2k-component *
          $packed = $LASTEXITCODE
          Pop-Location
          if ($packed -ne 0) { exit $packed }
          Copy-Item $output dist/foo_out_wam.dll
          git archive `
            --format=zip `
            --output=dist/wambridge-source.zip `
            HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: foo_out_wam-x64
          path: |
            dist/control/wambridge-control.exe
            dist/events/wambridge-events.exe
            dist/foo_out_wam.dll
            dist/foo_out_wam.fb2k-component
            dist/wambridge-source.zip
          if-no-files-found: error
