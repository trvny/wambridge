name: Finish sleep timer ownership

on:
  push:
    branches: [feat/foobar-sleep-timer]
    paths: [.github/workflows/finish-sleep-timer-ownership.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'trvny/wambridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/foobar-sleep-timer
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
      - name: Separate configured timer from menu ownership
        shell: python
        run: |
          from pathlib import Path

          path = Path("foobar/foo_out_wam.cpp")
          text = path.read_text(encoding="utf-8")
          start_marker = "        const bool menuSleepTimerActive = wam::menu_sleep_timer_active();\n"
          end_marker = "        if (m_sleepTimerArmed.load() && !menuSleepTimerActive) {\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              start_marker
              + '        command += L" --sleep-after-stop " +\n'
              + "            std::to_wstring(m_settings.sleepAfterStopSeconds);\n"
              + "        if (menuSleepTimerActive) {\n"
              + '            command += L" --menu-sleep-timer-active";\n'
              + "        }\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          path = Path("src/wambridge/pcm_cli.py")
          text = path.read_text(encoding="utf-8")
          marker = '    parser.add_argument(\n        "--clear-sleep-timer",\n'
          if marker not in text:
              raise SystemExit("parser insertion point not found")
          insertion = (
              '    parser.add_argument(\n'
              '        "--menu-sleep-timer-active",\n'
              '        action="store_true",\n'
              '        help=(\n'
              '            "Preserve an explicit menu-owned timer already accepted by the "\n'
              '            "speaker while retaining --sleep-after-stop for later release"\n'
              '        ),\n'
              '    )\n'
          )
          text = text.replace(marker, insertion + marker, 1)

          marker = "        clear_sleep_timer: bool = False,\n"
          if marker not in text:
              raise SystemExit("watcher signature target not found")
          text = text.replace(
              marker,
              "        menu_sleep_timer_active: bool = False,\n" + marker,
              1,
          )

          marker = "        self._menu_sleep_timer_active = False\n"
          if marker not in text:
              raise SystemExit("watcher state target not found")
          text = text.replace(
              marker,
              "        self._menu_sleep_timer_active = menu_sleep_timer_active\n",
              1,
          )

          marker = "            clear_sleep_timer=args.clear_sleep_timer,\n"
          if marker not in text:
              raise SystemExit("watcher construction target not found")
          text = text.replace(
              marker,
              "            menu_sleep_timer_active=args.menu_sleep_timer_active,\n" + marker,
              1,
          )
          path.write_text(text, encoding="utf-8")
      - name: Validate ownership split
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run ruff check --select E,F,B,UP src tests foobar/wambridge_pcm_entry.py tools
          uv run python -m unittest discover -s tests -v
      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git rm .github/workflows/finish-sleep-timer-ownership.yml
          git add foobar/foo_out_wam.cpp src/wambridge/pcm_cli.py
          git commit -m 'fix(foobar): preserve configured after-stop timer'
          git push origin HEAD:feat/foobar-sleep-timer
